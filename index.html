    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        // Ensure window.fetch is writable and configurable with a setter so browser extensions
        // (such as Urban VPN, translators, or network interceptors) do not throw
        // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        try {
          var _nativeFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _nativeFetch;
            },
            set: function (newFetch) {
              _nativeFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (err) {
          // Fallback if property is non-configurable
        }

        // Suppress unhandled errors originating from external browser extensions or Vite HMR in container
        window.addEventListener('error', function (event) {
          var file = (event && event.filename) || '';
          var msg = (event && (event.message || '')) || '';
          var errStr = (event && event.error && (event.error.message || event.error.stack || String(event.error))) || '';
          var fullText = file + ' ' + msg + ' ' + errStr;
          if (
            fullText.indexOf('chrome-extension://') !== -1 ||
            fullText.indexOf('moz-extension://') !== -1 ||
            fullText.indexOf('safari-extension://') !== -1 ||
            fullText.indexOf('@vite/client') !== -1 ||
            fullText.indexOf('closed without opened') !== -1 ||
            fullText.indexOf('WebSocket closed') !== -1 ||
            (fullText.indexOf('[vite]') !== -1 && fullText.indexOf('WebSocket') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = (event && event.reason) || '';
          var stack = (reason && (reason.stack || reason.message || String(reason))) || '';
          if (
            stack.indexOf('chrome-extension://') !== -1 ||
            stack.indexOf('moz-extension://') !== -1 ||
            stack.indexOf('safari-extension://') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            stack.indexOf('closed without opened') !== -1 ||
            stack.indexOf('WebSocket closed') !== -1 ||
            (stack.indexOf('[vite]') !== -1 && stack.indexOf('WebSocket') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Suppress console.error for Vite HMR closed without opened
        var _originalConsoleError = console.error;
        console.error = function () {
          var text = Array.prototype.slice.call(arguments).map(function (a) {
            if (!a) return '';
            if (a instanceof Error) return (a.message || '') + ' ' + (a.stack || '');
            if (typeof a === 'object') {
              try { return JSON.stringify(a); } catch (e) { return String(a); }
            }
            return String(a);
          }).join(' ');

          if (
            text.indexOf('closed without opened') !== -1 ||
            text.indexOf('WebSocket closed') !== -1 ||
            (text.indexOf('[vite]') !== -1 && text.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          _originalConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
